name: Windows

# Manual only. Nothing here runs on a push: Actions minutes on a private
# repo are metered, and a build that nobody asked for is a build nobody
# wanted to pay for.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # The same JUCE 9 commit every Naaman plug-in is pinned to.
      JUCE_SHA: 857aab9c4eb3084af639a380a693dcec7d728b73

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_SHA }}

      - name: Fetch JUCE at the pinned commit
        if: steps.juce-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git init JUCE
          cd JUCE
          git remote add origin https://github.com/juce-framework/JUCE.git
          git fetch --depth 1 origin "$JUCE_SHA"
          git checkout FETCH_HEAD

      # Which Visual Studio the runner actually has, printed before it matters.
      # Hardcoding "Visual Studio 17 2022" failed outright once the image moved
      # on, and the error said only "could not find any instance".
      - name: Show the toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -format value -property displayName,installationVersion,installationPath
          } else {
            Write-Host "vswhere is not on this image"
          }
          cmake --version

      # No -G: CMake picks the newest Visual Studio generator present, so the
      # job survives the runner image being upgraded under us.
      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DORCHA_COPY_AFTER_BUILD=OFF
          -DORCHA_JUCE_DIR_OVERRIDE=${{ github.workspace }}/JUCE

      - name: Build plug-in and standalone
        run: cmake --build build --config Release --target Orcha_VST3 Orcha_Standalone --parallel

      # The reason this workflow is worth its minutes: MSVC sees things clang
      # does not, and the engine's own suite is the fastest way to find them.
      - name: Build the engine test suite
        run: cmake --build build --config Release --target OrchaTests --parallel

      - name: Run the engine test suite
        run: ./build/OrchaTests_artefacts/Release/OrchaTests.exe

      # A plug-in that needs the Visual C++ Redistributable fails to load on a
      # clean machine, silently - the host just does not list it. The runtime
      # is linked statically; this proves it stayed that way.
      - name: No Visual C++ Redistributable dependency
        shell: pwsh
        run: |
          $dll = "build/Orcha_artefacts/Release/VST3/ORCHA.vst3/Contents/x86_64-win/ORCHA.vst3"
          $dumpbin = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
          if (-not $dumpbin) { Write-Host "dumpbin not found - skipping"; exit 0 }
          $imports = & $dumpbin.FullName /dependents $dll
          $imports | Write-Host
          $bad = $imports | Select-String -Pattern "MSVCP\d+\.dll|VCRUNTIME\d+"
          if ($bad) {
            Write-Host "::error::the plug-in depends on the VC++ Redistributable"
            exit 1
          }
          Write-Host "no VC++ Redistributable dependency"

      # The artifact IS the bundle that gets sent to people: a prebuilt plugin
      # next to the simple copy installer. No compiler on their side.
      - name: Stage the sendable bundle
        shell: bash
        run: |
          mkdir -p out
          cp -r build/Orcha_artefacts/Release/VST3/ORCHA.vst3 out/
          cp build/Orcha_artefacts/Release/Standalone/ORCHA.exe out/ || true
          cp packaging/INSTALL-ORCHA.bat out/
          cp packaging/UNINSTALL-ORCHA.bat out/
          cp packaging/README-ORCHA-WINDOWS.txt out/README.txt
          test -f out/ORCHA.vst3/Contents/x86_64-win/ORCHA.vst3

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ORCHA-windows-x64
          path: out
          if-no-files-found: error
